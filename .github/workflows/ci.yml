name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protobuf-compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      # Installs the exact toolchain pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Raumfeld adapter: stdlib-only Python, tested with the runner's python3.
      - name: Test Raumfeld adapter
        run: python3 -m unittest discover -s adapter -v

      - name: Install cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      # Fails on vulnerabilities only; unmaintained/unsound advisories are reported as warnings.
      - name: Audit dependencies
        run: cargo audit
