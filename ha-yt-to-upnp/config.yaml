name: YouTube to UPnP
version: "0.4.0"
slug: yt_to_upnp
description: >-
  YouTube Music cast receiver (DIAL + Lounge API) that plays through MPD's
  HTTP stream on a Teufel Raumfeld room via UPnP. Home Assistant builds it
  from this repository with prebuilt programs from the GitHub release.
arch:
  - amd64
startup: application
boot: auto
stage: experimental
# s6-overlay v3 (the base image's /init) needs Docker's own init disabled.
init: false
# SSDP/DIAL discovery and the Raumfeld's UPnP need multicast on the LAN.
host_network: true
options:
  cast_name: YouTube to UPnP
  raumfeld_room_udn: null
  stream_format: flac
  log_level: info
  # Optional options are not listed: the Supervisor rejects a null default as a
  # missing option, even for an optional one.
schema:
  # The receiver writes the name unescaped into its DIAL device description.
  cast_name: 'match(^[^<>&"\x00-\x1f]{1,60}$)'
  raumfeld_room_udn: match(^uuid:[0-9A-Za-z-]{1,64}$)
  # Required unless raumfeld_host is set; the schema can't say so, the start
  # check (rootfs/usr/lib/ytcast/check_options.py) does.
  raumfeld_speaker_udn: match(^uuid:[0-9A-Za-z-]{1,64}$)?
  # The adapter's RAUMFELD_HOST rules: an IPv4 address (digits and dots only must
  # be one) or a DNS name; no port, scheme or path.
  raumfeld_host: 'match(^(((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])|(?=.{1,253}$)(?=[0-9.]*[A-Za-z-])[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*)$)?'
  stream_host: match(^[0-9A-Za-z.-]{1,253}$)?
  start_gate_seconds: int(0,60)?
  stuck_seconds: int(1,300)?
  # FLAC 16-bit (the Raumfeld does not play 24-bit FLAC streams) or MP3 320 kbit/s.
  stream_format: list(flac|mp3)
  log_level: list(debug|info|warning|error)
